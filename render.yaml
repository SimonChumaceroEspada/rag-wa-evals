services:
  - type: web
    name: rag-wa-evals
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Keep-alive interno: hilo en api/keepalive.py pega a esta URL cada 10 min
      # para que el plan free no suspenda el servicio (15 min sin tráfico).
      - key: KEEPALIVE_URL
        value: https://rag-wa-evals.onrender.com
      - key: NIM_CHAT_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NIM_EMBED_MODEL
        value: nvidia/nemotron-3-embed-1b
