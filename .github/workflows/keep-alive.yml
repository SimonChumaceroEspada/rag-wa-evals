name: keep-alive

# Render free duerme el servicio tras 15 min sin tráfico (~50s de despertar,
# medido hasta 127s la primera petición). Este ping INTENTA mantenerlo despierto,
# pero GitHub demora los cron programados por horas (observado 2026-10-01:
# huecos de 5-6h entre corridas). La web además se despierta sola al abrirse
# (ping en page.tsx). Para un keep-awake real usar UptimeRobot/Better Stack.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despierta Render
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
              https://rag-wa-evals.onrender.com/openapi.json || echo 000)
            echo "intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Render no responde"
          exit 1
