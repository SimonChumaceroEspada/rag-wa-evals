name: keep-alive

# Render free duerme el servicio tras 15 min sin tráfico (~50s de despertar,
# medido hasta 127s). ESTE CRON ES SOLO REDUNDANCIA: medido 2026-10-01, para
# `*/10 * * * *` GitHub sólo ejecutó 5 corridas en 20 h (retrasa/omite runs
# en repos con poca actividad). El keep-alive real es api/keepalive.py (hilo
# interno, cada 10 min) + el ping de la web al abrirse (web/app/page.tsx).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despierta Render
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
              https://rag-wa-evals.onrender.com/openapi.json || echo 000)
            echo "intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Render no responde"
          exit 1
